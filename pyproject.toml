[project]
name = "auto-sft"
version = "0.1.0"
description = "Automated SFT pipeline for Terminal-Bench style tasks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Rakesh" }]
keywords = ["sft", "fine-tuning", "terminal-bench", "agent", "llm", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "trl>=0.11",
    "peft>=0.12",
    "accelerate>=0.33",
    "datasets>=2.20",
    "safetensors>=0.4",
    "bitsandbytes>=0.43",
]
terminal-bench = [
    "terminal-bench>=0.2.18",
]
s3 = [
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
]

[project.scripts]
auto-sft = "auto_sft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_sft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# typer requires function calls (typer.Option) in argument defaults.
"src/auto_sft/cli.py" = ["B008"]